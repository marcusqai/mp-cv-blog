{{ define "main" }}
<article class="post-content">
    {{ with site.Params.email }}
    {{ $emailName := printf "Marcus Poon &lt;%s&gt;" site.Params.email }}
    <div style="margin-bottom: 1.5rem; padding: 0.8rem 1.2rem; background: var(--entry); border-radius: 8px; border: 1px solid var(--border); display: inline-block;">
        <a href="mailto:{{ $emailName }}" style="color: var(--primary); text-decoration: none; font-size: 0.95rem;">
            <svg style="vertical-align: middle; margin-right: 4px;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            {{ site.Params.email }}
        </a>
    </div>
    {{ end }}
    {{ .Content }}
</article>
{{ end }}
