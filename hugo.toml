baseURL = "https://cv.marcuspoon.eu.org/"
languageCode = "en-us"
title = "Marcus Poon | Quality Professional"
theme = "PaperMod"
pagination.pagerSize = 5
enableRobotsTXT = true
enableEmoji = true

[params]
  author = "Marcus Poon"
  description = "Quality Professional | Supplier Management Specialist | APAC Region"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = false
  env = "production"

  [params.profileMode]
    enabled = true
    title = "Marcus Poon"
    subtitle = "Quality Professional | Supplier Management | APAC"
    imageUrl = "https://ui-avatars.com/api/?name=Marcus+Poon&size=200&background=1a1a2e&color=ffffff&bold=true"
    imageWidth = 150
    imageHeight = 150
    buttons = [
      { name = "View CV", url = "/cv/" },
      { name = "Read Blog", url = "/posts/" }
    ]

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/marcuspoon/"
    icon = "linkedin"
    iconHeight = 24

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 0
  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "cv"
    name = "CV"
    url = "/cv/"
    weight = 2

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true

[privacy.vimeo]
  disabled = true
[privacy.twitter]
  disabled = true
[privacy.youtube]
  disabled = true