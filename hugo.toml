baseURL = "https://cv.marcuspoon.eu.org/"
languageCode = "en-us"
title = "Marcus Poon | Quality Professional"
theme = "PaperMod"
pagination.pagerSize = 5
enableRobotsTXT = true
enableEmoji = true

[params]
  author = "Marcus Poon"
  description = "APAC Supplier Quality & Operations Leader | Sustainable Supplier Management | Manufacturing Transfer"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = false
  env = "production"

  [params.profileMode]
    enabled = true
    title = "Marcus Poon"
    subtitle = "APAC Supplier Quality & Operations Leader"
    buttons = [
      { name = "📄 View CV", url = "/cv/" },
      { name = "🔧 About Work", url = "/about-work/" },
      { name = "✍️ Read Blog", url = "/posts/" }
    ]

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/5whys-adblock/AdGuardHome-rules"
    icon = "github"
    iconHeight = 24

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/marcuspoon/"
    icon = "linkedin"
    iconHeight = 24

[menu]
  [[menu.main]]
    identifier = "home"
    name = "🏠 Home"
    url = "/"
    weight = 0
  [[menu.main]]
    identifier = "about-work"
    name = "🔧 About Work"
    url = "/about-work/"
    weight = 1
  [[menu.main]]
    identifier = "blog"
    name = "✍️ Blog"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    identifier = "cv"
    name = "📄 CV"
    url = "/cv/"
    weight = 3

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true

[privacy.vimeo]
  disabled = true
[privacy.twitter]
  disabled = true
[privacy.youtube]
  disabled = true